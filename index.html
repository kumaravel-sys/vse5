<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>School Market</title>
  <style>
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: var(--bg, #f5f5f5);
    }
    .login, .market {
      display: none; padding: 20px;
    }
    .login { text-align: center; margin-top: 100px; }
    .grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 15px; margin-top: 20px;
    }
    .stock-card {
      padding: 15px; border-radius: 12px; background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .stock-name { font-weight: bold; }
    .stock-symbol { font-size: 12px; color: gray; }
    .price { font-size: 20px; margin-top: 10px; }
    .change.up { color: green; }
    .change.down { color: red; }
    .controls { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="login" id="login">
    <h2>Enter Password</h2>
    <input type="password" id="pw" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="error" style="color:red;"></p>
  </div>

  <div class="market" id="market">
    <h1>📈 School Stock Market</h1>
    <div class="controls">
      <label>Background: <input type="color" onchange="changeBg(this.value)"></label>
    </div>
    <div class="grid" id="stocks"></div>
    <div class="controls">
      <a href="https://your-demat-website.com" target="_blank">Open Demat Account</a>
    </div>
    <button onclick="logout()">Logout</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
